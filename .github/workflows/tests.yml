name: CI – Tests

# ── Mediation-specific values ──────────────────────────────────────────────
# When adding a new mediation adapter repo, copy this file and update only
# the env block below. All other steps are mediation-agnostic.
env:
  ADAPTER_MODULE: velocity-gma-adapter

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# NOTE: This workflow depends on `io.velocity:ads-sdk` being available on
# Maven Central. CI will fail until the matching SDK version ships. Gate
# merges manually (or via draft PR) until the SDK is released.

jobs:
  test:
    name: Format · Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Verify Kotlin formatting (ktlint)
        run: ./gradlew :${{ env.ADAPTER_MODULE }}:ktlintCheck

      - name: Build and run unit tests
        run: ./gradlew :${{ env.ADAPTER_MODULE }}:build

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ${{ env.ADAPTER_MODULE }}/build/reports/tests/
          retention-days: 7
